<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fbf7ed"/>
      <stop offset="0.45" stop-color="#f3ebda"/>
      <stop offset="1" stop-color="#e5d8c1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFar" x="-30%" y="-250%" width="160%" height="600%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="blurNear" x="-30%" y="-250%" width="160%" height="600%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.7" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#paper)"/>
  <rect width="2560" height="1440" fill="url(#glow)"/>

  <g filter="url(#blurFar)" opacity="0.22">
    <path d="M-100 1180 C 260 1030 480 1140 760 1090 C 1040 1040 1180 1130 1460 1100 C 1740 1070 1980 1140 2260 1080 C 2380 1055 2480 1070 2660 1040 L 2660 1540 L -100 1540 Z" fill="#5a6670"/>
  </g>
  <g filter="url(#blurNear)" opacity="0.20">
    <path d="M-100 1280 C 220 1180 420 1250 700 1210 C 980 1170 1140 1270 1420 1240 C 1700 1210 1900 1260 2180 1210 C 2360 1180 2520 1210 2660 1190 L 2660 1540 L -100 1540 Z" fill="#43505a"/>
  </g>
  <g filter="url(#blurNear)" opacity="0.12">
    <path d="M-100 1370 C 300 1300 520 1350 820 1330 C 1120 1310 1360 1360 1660 1340 C 1960 1320 2260 1360 2660 1320 L 2660 1540 L -100 1540 Z" fill="#2f3a42"/>
  </g>

  <rect width="2560" height="1440" filter="url(#fiber)" opacity="0.55"/>
  <rect width="2560" height="1440" filter="url(#grain)"/>

  <!-- 印章：等数字化后再启用
  <g transform="translate(2146 1084) rotate(-4)" opacity="0.9">
    <rect width="132" height="132" rx="12" fill="#A31F34"/>
    <rect x="11" y="11" width="110" height="110" rx="6" fill="none" stroke="#fdf8ee" stroke-width="2.5" opacity="0.85"/>
    <path d="M34 96 L60 62 L78 84 L92 70 L110 96" fill="none" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="44" r="5" fill="#fdf8ee"/>
  </g>
  -->
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="0.55" stop-color="#111016"/>
      <stop offset="1" stop-color="#1b1214"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#9b2f38" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#5c2028" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5c2028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blurFar" x="-30%" y="-250%" width="160%" height="600%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blurNear" x="-30%" y="-250%" width="160%" height="600%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.09"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#night)"/>
  <rect width="2560" height="1440" fill="url(#ember)"/>

  <g filter="url(#blurFar)" opacity="0.55">
    <path d="M-100 1210 C 260 1060 500 1160 780 1110 C 1060 1060 1200 1150 1480 1120 C 1760 1090 2000 1160 2280 1100 C 2400 1075 2500 1090 2660 1060 L 2660 1540 L -100 1540 Z" fill="#05070c"/>
  </g>
  <g filter="url(#blurNear)" opacity="0.7">
    <path d="M-100 1290 C 220 1190 420 1260 700 1220 C 980 1180 1140 1280 1420 1250 C 1700 1220 1900 1270 2180 1220 C 2360 1190 2520 1220 2660 1200 L 2660 1540 L -100 1540 Z" fill="#030407"/>
  </g>
  <g filter="url(#blurNear)" opacity="0.85">
    <path d="M-100 1380 C 300 1310 520 1360 820 1340 C 1120 1320 1360 1370 1660 1350 C 1960 1330 2260 1370 2660 1330 L 2660 1540 L -100 1540 Z" fill="#000000"/>
  </g>

  <rect width="2560" height="1440" fill="url(#vignette)"/>
  <rect width="2560" height="1440" filter="url(#grain)"/>

  <!-- 印章：等数字化后再启用
  <g transform="translate(2146 1084) rotate(-4)" opacity="0.88">
    <rect width="132" height="132" rx="12" fill="#A31F34"/>
    <rect x="11" y="11" width="110" height="110" rx="6" fill="none" stroke="#fdf8ee" stroke-width="2.5" opacity="0.8"/>
    <path d="M34 96 L60 62 L78 84 L92 70 L110 96" fill="none" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="44" r="5" fill="#fdf8ee"/>
  </g>
  -->
</svg>
